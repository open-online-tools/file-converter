name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'converter-wasm/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'converter-wasm/**'
      - 'web/**'
      - '.github/workflows/ci.yml'

jobs:
  rust:
    name: Rust tests & clippy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: converter-wasm

      - name: Check formatting
        run: cargo fmt --manifest-path converter-wasm/Cargo.toml -- --check

      - name: Clippy
        run: >
          cargo clippy
          --manifest-path converter-wasm/Cargo.toml
          --all-targets
          --all-features
          -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path converter-wasm/Cargo.toml

      - name: Check WASM target compiles
        run: >
          cargo check
          --manifest-path converter-wasm/Cargo.toml
          --target wasm32-unknown-unknown

  web:
    name: Web app tests & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Run tests
        run: npm test
        working-directory: web
